services:
  # ─── Postgres ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: automation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: automation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d automation"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ─── API ──────────────────────────────────────────────
  api:
    build: .
    container_name: automation-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the compose service name ("db")
      DATABASE_URL: postgres://app:app@db:5432/automation
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount secrets read-only so the container can read them
      # but can't modify them (and they never end up in the image).
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json:ro

volumes:
  pgdata: